name: MapNifique dependency compatibility

on:
  push:
    branches:
      - "work/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimatch-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the isolated minimatch 11 override against Crawlee
        run: npm run test:security:minimatch
