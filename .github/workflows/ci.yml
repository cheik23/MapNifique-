name: MapNifique CI

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            backend/scraper/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend/scraper
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Check backend syntax
        run: npm run check:backend

      - name: Run backend tests
        run: npm run test:backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Audit backend dependencies
        run: npm audit --prefix backend/scraper --audit-level=moderate

      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=moderate

      - name: Run frontend unit tests
        run: npm run test:unit --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Validate PostgreSQL migrations, concurrency and backup/restore
        run: npm --prefix backend/scraper run test:postgres:prompt26
